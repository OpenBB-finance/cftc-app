name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set environment variables on Dokku
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOYER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DOKKU_HOST }} >> ~/.ssh/known_hosts
          ssh dokku@${{ secrets.DOKKU_HOST }} config:set --no-restart cftc-app CFTC_APP_TOKEN=${{ secrets.CFTC_APP_TOKEN }}

      - name: Deploy
        uses: dokku/github-action@master
        with:
          git_remote_url: ${{ secrets.DOKKU_PROD_REMOTE }}
          ssh_private_key: ${{ secrets.DEPLOYER_SSH_PRIVATE_KEY }}
          git_push_flags: "--force"
          branch: main
